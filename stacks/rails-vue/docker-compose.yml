services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: shop
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U app -d shop"]
      interval: 5s
      retries: 120

  payment-mock:
    build: ./payment-mock
    ports:
      - "4010:4010"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://app:app@db:5432/shop
      PAYMENT_URL: http://payment-mock:4010
      PAYMENT_TIMEOUT_MS: "5000"
      LOG_SQL: "0"
    ports:
      - "8080:8080"
    volumes:
      - ./backend/app:/app/app
      - ./backend/config:/app/config
    depends_on:
      db:
        condition: service_healthy
      payment-mock:
        condition: service_started

  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:8080
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend

volumes:
  db-data:
